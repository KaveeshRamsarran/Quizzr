services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quizzr
      POSTGRES_PASSWORD: quizzr_dev_password
      POSTGRES_DB: quizzr
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizzr"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://quizzr:quizzr_dev_password@postgres:5432/quizzr
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ENVIRONMENT: production
      FRONTEND_URL: http://localhost:8002
      UPLOAD_DIR: /data/uploads
    ports:
      - "8002:8002"
    volumes:
      - upload_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  upload_data:

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Quizzr turns your lecture PDFs into flashcards, quizzes and a spaced-repetition review schedule." />
    <meta name="theme-color" content="#f7f5fc" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
    <title>Quizzr: study from your own notes</title>
    <script>
      // Apply the saved colour mode before first paint so the page never flashes.
      (function () {
        try {
          var mode = localStorage.getItem('quizzr-theme') || 'system';
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="padding:24px">Quizzr needs JavaScript to run.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Render Blueprint: one Docker web service (API + built frontend) and a Postgres database.
# Render dashboard: New > Blueprint > pick this repository.
services:
  - type: web
    name: quizzr
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quizzr-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: UPLOAD_DIR
        value: /tmp/quizzr-uploads

databases:
  - name: quizzr-db
    plan: free
    databaseName: quizzr
    user: quizzr

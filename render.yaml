# Render Blueprint: one Docker web service (API + built frontend).
# The database and sign-in are hosted on Supabase; see "Deploying with Supabase" in README.md.
# Render dashboard: New > Blueprint > pick this repository, then fill in the values marked sync: false.
services:
  - type: web
    name: quizzr
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Supabase > Connect > Session pooler (IPv4). Render cannot reach the IPv6-only direct host.
      - key: DATABASE_URL
        sync: false
      # Supabase > Project Settings > API Keys
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Stores uploaded PDFs in Supabase Storage (Render's disk is wiped on every deploy)
      # and lets "Delete my account" remove the Supabase sign-in too. Keep it secret.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Optional: e.g. "google,github", after enabling them in Supabase > Authentication > Providers
      - key: SUPABASE_OAUTH_PROVIDERS
        sync: false
      # Your Render URL, e.g. https://quizzr.onrender.com
      - key: FRONTEND_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # Only used if SUPABASE_SERVICE_ROLE_KEY is missing; files here vanish on restart.
      - key: UPLOAD_DIR
        value: /tmp/quizzr-uploads
